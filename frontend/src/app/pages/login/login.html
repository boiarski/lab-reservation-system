<h1>Lab Reservation System</h1>

<h2>Login</h2>

<form (ngSubmit)="login()" data-testid="login-form">
  <div>
    <label>Email</label>
    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      data-testid="login-email"
      required
    />
  </div>

  <div>
    <label>Password</label>
    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      data-testid="login-password"
      required
    />
  </div>

  <button
    type="submit"
    [disabled]="isSubmitting()"
    data-testid="login-submit"
  >
    @if (isSubmitting()) {
      Logging in...
    } @else {
      Login
    }
  </button>
</form>

@if (errorMessage()) {
  <p data-testid="login-error">
    {{ errorMessage() }}
  </p>
}
